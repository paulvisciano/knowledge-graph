<!-- ── Prototype controls (not part of the component) ── -->
<div class="proto-controls">
  <button class="proto-btn active" onclick="toggleState('expanded')">Expanded</button>
  <button class="proto-btn" onclick="toggleState('collapsed')">Collapsed</button>
  <button class="proto-btn" onclick="toggleState('indicator')">Indicator Only</button>
  <button class="proto-btn" onclick="toggleState('mobile')">Mobile View</button>
</div>

<script>
  const dock = document.getElementById('processingDock');
  const indicator = document.getElementById('dockIndicator');
  const btns = document.querySelectorAll('.proto-btn');

  function toggleState(state) {
    btns.forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');

    if (state === 'expanded') {
      dock.classList.remove('collapsed', 'dock-mobile-open');
      dock.style.display = '';
      indicator.style.display = 'none';
    } else if (state === 'collapsed') {
      dock.classList.add('collapsed');
      dock.classList.remove('dock-mobile-open');
      dock.style.display = '';
      indicator.style.display = '';
    } else if (state === 'indicator') {
      dock.classList.add('collapsed');
      dock.classList.remove('dock-mobile-open');
      dock.style.display = 'none';
      indicator.style.display = 'flex';
    } else if (state === 'mobile') {
      dock.classList.add('collapsed', 'dock-mobile-open');
      dock.style.display = '';
      indicator.style.display = 'none';
    }
  }

  // Click dock header to toggle collapse
  document.getElementById('dockHeader').addEventListener('click', () => {
    dock.classList.toggle('collapsed');
  });

  // Click indicator to open
  indicator.addEventListener('click', () => {
    dock.classList.remove('collapsed');
    dock.classList.add('dock-mobile-open');
    indicator.style.display = 'none';
  });

  // Keyboard support for dock header
  document.getElementById('dockHeader').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      dock.classList.toggle('collapsed');
    }
  });

  // Keyboard support for dock indicator
  indicator.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      dock.classList.remove('collapsed');
      dock.classList.add('dock-mobile-open');
      indicator.style.display = 'none';
    }
  });
</script>

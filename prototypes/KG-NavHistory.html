        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:4rem;padding-bottom:4rem;text-align:center;">
          <div style="display:flex;height:3rem;width:3rem;align-items:center;justify-content:center;border-radius:0.75rem;border:1px solid rgba(30,45,69,0.3);background:rgba(26,34,53,0.3);">
            <span class="icon-svg" style="color:var(--color-cyber-text-dim);">
              <svg width="20" height="20" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </span>
          </div>
          <p style="margin-top:0.75rem;font-size:0.75rem;color:var(--color-cyber-text-dim);">No conversations yet</p>
        </div>
      </div>
    </aside>
  </div>

  <script>
    // ===== State =====
    let navOpen = false;
    let historyOpen = false;
    let isMobile = false;
    let activeTab = 'graph'; // 'graph' | 'ingestion'
    const statuses = ['connected', 'disconnected', 'busy', 'error'];
    let statusIndex = 0;

    // ===== NavDrawer =====
    function toggleNav() {
      navOpen = !navOpen;
      if (isMobile) {
        document.getElementById('nav-mobile-backdrop').classList.toggle('hidden', !navOpen);
      } else {
        document.getElementById('nav-backdrop').classList.toggle('hidden', !navOpen);
      }
      document.getElementById('btn-nav').classList.toggle('active', navOpen);
    }

    function closeNavBackdrop(e) {
      if (e.target === e.currentTarget) {
        navOpen = false;
        document.getElementById('nav-backdrop').classList.add('hidden');
        document.getElementById('btn-nav').classList.remove('active');
      }
    }

    function closeNavMobileBackdrop(e) {
      if (e.target === e.currentTarget) {
        navOpen = false;
        document.getElementById('nav-mobile-backdrop').classList.add('hidden');
        document.getElementById('btn-nav').classList.remove('active');
      }
    }

    // ===== HistoryPanel =====
    function toggleHistory() {
      historyOpen = !historyOpen;
      if (isMobile) {
        document.getElementById('history-mobile-backdrop').classList.toggle('hidden', !historyOpen);
      } else {
        document.getElementById('history-backdrop').classList.toggle('hidden', !historyOpen);
      }
      document.getElementById('btn-history').classList.toggle('active', historyOpen);
      // Close nav if open
      if (historyOpen && navOpen) {
        navOpen = false;
        document.getElementById('nav-backdrop').classList.add('hidden');
        document.getElementById('nav-mobile-backdrop').classList.add('hidden');
        document.getElementById('btn-nav').classList.remove('active');
      }
    }

    function closeHistoryBackdrop(e) {
      if (e.target === e.currentTarget) {
        historyOpen = false;
        document.getElementById('history-backdrop').classList.add('hidden');
        document.getElementById('btn-history').classList.remove('active');
      }
    }

    function closeHistoryMobileBackdrop(e) {
      if (e.target === e.currentTarget) {
        historyOpen = false;
        document.getElementById('history-mobile-backdrop').classList.add('hidden');
        document.getElementById('btn-history').classList.remove('active');
      }
    }

    function closeHistoryEmptyBackdrop(e) {
      if (e.target === e.currentTarget) {
        document.getElementById('history-empty-backdrop').classList.add('hidden');
      }
    }

    // ===== Tab switching =====
    function setActiveTab(tabId) {
      activeTab = tabId;
      document.querySelectorAll('#nav-panel .nav-item').forEach(function(btn) {
        btn.classList.remove('nav-item-active');
        var glow = btn.querySelector('.nav-item-glow');
        if (glow) glow.remove();
      });
      var activeBtn = document.getElementById('nav-tab-' + tabId);
      if (activeBtn) {
        activeBtn.classList.add('nav-item-active');
        var glowDiv = document.createElement('div');
        glowDiv.className = 'nav-item-glow';
        activeBtn.appendChild(glowDiv);
        var icon = activeBtn.querySelector('.nav-item-icon .icon-svg');
        if (icon) icon.style.color = 'var(--color-cyber-cyan)';
      }
      var inactiveId = tabId === 'graph' ? 'ingestion' : 'graph';
      var inactiveBtn = document.getElementById('nav-tab-' + inactiveId);
      if (inactiveBtn) {
        var inactiveIcon = inactiveBtn.querySelector('.nav-item-icon .icon-svg');
        if (inactiveIcon) inactiveIcon.style.color = 'currentColor';
      }
    }

    function setActiveTabMobile(tabId) {
      activeTab = tabId;
      document.querySelectorAll('#nav-mobile-sheet .nav-item').forEach(function(btn) {
        btn.classList.remove('nav-item-active');
        var glow = btn.querySelector('.nav-item-glow');
        if (glow) glow.remove();
      });
      var activeBtn = document.getElementById('nav-mobile-tab-' + tabId);
      if (activeBtn) {
        activeBtn.classList.add('nav-item-active');
        var glowDiv = document.createElement('div');
        glowDiv.className = 'nav-item-glow';
        activeBtn.appendChild(glowDiv);
        var icon = activeBtn.querySelector('.nav-item-icon .icon-svg');
        if (icon) icon.style.color = 'var(--color-cyber-cyan)';
      }
      var inactiveId = tabId === 'graph' ? 'ingestion' : 'graph';
      var inactiveBtn = document.getElementById('nav-mobile-tab-' + inactiveId);
      if (inactiveBtn) {
        var inactiveIcon = inactiveBtn.querySelector('.nav-item-icon .icon-svg');
        if (inactiveIcon) inactiveIcon.style.color = 'currentColor';
      }
    }

    // ===== Status cycling =====
    function cycleStatus() {
      statusIndex = (statusIndex + 1) % statuses.length;
      var status = statuses[statusIndex];
      ['status-lr', 'status-llm', 'status-lr-mobile', 'status-llm-mobile'].forEach(function(id) {
        var el = document.getElementById(id);
        if (el) el.className = 'status-dot status-dot-' + status;
      });
    }

    // ===== Mobile toggle =====
    function toggleMobile() {
      isMobile = !isMobile;
      var btn = document.getElementById('btn-mobile');
      btn.classList.toggle('active', isMobile);

      // Hide any open panels
      document.getElementById('nav-backdrop').classList.add('hidden');
      document.getElementById('nav-mobile-backdrop').classList.add('hidden');
      document.getElementById('history-backdrop').classList.add('hidden');
      document.getElementById('history-mobile-backdrop').classList.add('hidden');
      navOpen = false;
      historyOpen = false;
      document.getElementById('btn-nav').classList.remove('active');
      document.getElementById('btn-history').classList.remove('active');
    }

    // ===== Keyboard handling =====
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        if (navOpen) toggleNav();
        if (historyOpen) toggleHistory();
      }
    });
  </script>

</body>
</html>
